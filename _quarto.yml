project:
  type: website
  output-dir: docs 
  render:   
    - "*.qmd"
    - "notebooks/*.ipynb"
    - "!notebooks/colab/"



execute:
  #enabled: false
  freeze: auto
  echo: true
  warning: false
  message: false
  

website: 
    
  description: "Practical guides for accessing, analyzing, and visualizing GRID3 data"
  site-url: https://ciesin.github.io/GRID3_dataUserGuide/
  repo-url: https://github.com/ciesin/GRID3_dataUserGuide
  repo-actions: [edit, issue]
  favicon: images/favicon.ico

  

  navbar:
    logo: images/CIESIN_TransparentBackground_WhiteText.png
     

    left:
      - text: "Home"
        href: index.qmd

      - text: "Data Access" 
        menu:

          - text: "User Guide Template"
            href: notebooks/user_guide_template.qmd
          - text: "Friction Surface by LGA"
            href: notebooks/accessing_friction_surface_by_lga.qmd
          - text: "GRID3 COD - Roads v1.0 Data Release Notes"
            href: notebooks/Roads_DRN_MD.qmd

      - text: "Analysis"
        menu:      
          - text: "GRID3 Nigeria Road Network Analysis"
            href: notebooks/api_nga_network.ipynb
      - text: "Visualization"
        menu:
          - text: "Visualization 1"
             
       


    right:
      - icon: envelope-fill
        href: mailto:info@ciesin.columbia.edu
      - icon: database-fill
        href: https://data.grid3.org
      - icon: github
        href: https://github.com/ciesin/GRID3_dataUserGuide 
      - icon: linkedin
        href: https://www.linkedin.com/company/center-for-integrated-earth-system-information-ciesin/
      - icon: globe
        href: https://ciesin.columbia.edu



  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - index.qmd

      - section: "Data Access"
        contents: 
          - notebooks/user_guide_template.qmd
          - notebooks/accessing_friction_surface_by_lga.qmd
          - notebooks/Roads_DRN_MD.qmd

      - section: "Analysis"
        contents:
          - notebooks/api_nga_network.ipynb 
          # - notebooks/folium-maps.ipynb
          # - notebooks/geopandas-plots.ipynb

      - section: "Visualization"
        contents:
          # - notebooks/api-reference.ipynb

  google-analytics: 
    tracking-id: "G-45WWDMVLWW"
    anonymize-ip: true

  # body-footer: _footer.html
  page-footer:
    left: 
      - "© 2026 <a href='https://ciesin.columbia.edu'>CIESIN — Center for Integrated Earth System Information</a>, Columbia University."
 
    right:
      - icon: envelope-fill
        href: mailto:info@ciesin.columbia.edu
      - icon: database-fill
        href: https://data.grid3.org
      - icon: github
        href: https://github.com/ciesin/GRID3_dataUserGuide 
      - icon: linkedin
        href: https://www.linkedin.com/company/center-for-integrated-earth-system-information-ciesin/
      - icon: globe
        href: https://ciesin.columbia.edu



format:
  html:
    theme: default
    css: custom.css
    toc: true
    toc-location: right
    toc-depth: 4
    smooth-scroll: true
    code-copy: true
    number-sections: true
    fig-width: 6
    fig-height: 4
    fig-dpi: 120
    fig-alt-text: true
    lightbox: true
    navbar:
      type: default
    sidebar:
      collapse-level: 2
      float: false
      width: 300px 

    include-in-header: google-analytics.html
  



         