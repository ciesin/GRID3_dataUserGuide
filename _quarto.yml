project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "pages/*.qmd"
    - "pages/data-access/*.qmd"
    - "pages/analysis/*.qmd"
    - "pages/analysis/*.ipynb"
    - "pages/visualization/*.qmd"
    - "pages/resources/*.qmd"
    - "!pages/analysis/colab/"


execute:
  enabled: false
  freeze: auto
  echo: true
  warning: false
  message: false


website:
  # title: "CIESIN-GRID3 Spatial Data Science User Guide"
  description: "Guides and resources for working with CIESIN-GRID3 geospatial data."
  open-graph: true
  site-url: https://guides.ciesin.app/
  repo-url: https://github.com/ciesin/GRID3_dataUserGuide
  # repo-actions: [source]
  favicon: images/favicon.svg
  bread-crumbs: false
  back-to-top-navigation: true

  navbar:

    # background: "#1D4F91"
    # foreground: "#ffffff"

    logo: images/Columbia_University_Logo-Crown_white.png
    logo-href: /index.qmd

    collapse-below: "sm"

    left:
      - text: "Home"
        href: index.qmd
      - text: "Guides"
        menu:
          - text: "Data Access"
            href: pages/data-access/index.qmd
          - text: "Analysis"
            href: pages/analysis/index.qmd
          - text: "Visualization"
            href: pages/visualization/index.qmd
      - text: "Resources"
        href: pages/resources/index.qmd


    right:
      - text: "Contact"
        icon: envelope-fill
        href: pages/resources/#contact
      - text: "About"
        icon: info-circle-fill
        href: pages/resources/#about-ciesin




  # one named sidebar per section
  # to auto-populate a sidebar from a folder, replace the explicit file list
  # with the folder path (e.g. "pages/visualization/")
  # notebook entries sorted by frontmatter "order" property

  sidebar:

    - id: data-access
      title: "Data Access"
      style: "docked"
      search: true
      collapse-level: 2
      contents:
        - section: "Accessing data"
          contents: "pages/data-access/*"

    - id: analysis
      title: "Analysis"
      style: "docked"
      search: true
      collapse-level: 2
      contents:
        - text: Analyzing data
          href: pages/analysis/index.qmd
        - section: "Travel time analysis"
          contents: "pages/analysis/*friction*"
        - section: "Road network analysis"
          contents: "pages/analysis/*network*"

    - id: visualization
      title: "Visualization"
      style: "docked"
      search: true
      collapse-level: 2
      contents:
        - text: Visualizing data
          href: pages/visualization/index.qmd
        - section: "Making a map with QGIS"
          contents: "pages/visualization/qgis/*.qmd"
        - section: "Creating an interactive webmap"
          contents: "pages/visualization/pmtiles/*.qmd"


    - id: resources
      title: "Resources"
      style: "docked"
      search: true
      collapse-level: 2
      contents:
        - pages/resources/index.qmd
        # - text: "Resources"
        #   href: pages/resources/index.qmd
        # - text: "Links"
        #   href: pages/resources/links.qmd
        # - pages/resources/glossary.qmd
        # - pages/resources/user_guide_template.qmd



  search:
    location: sidebar
    type: textbox

  google-analytics:
    tracking-id: "G-45WWDMVLWW"
    anonymize-ip: true

  # body-footer: _footer.html
  page-footer:
    left:
      - "<a href='https://www.columbia.edu/content/copyright'>©2026 Columbia University</a>"

    right:
      - icon: envelope-fill
        href: mailto:info@ciesin.columbia.edu
      - icon: database-fill
        href: https://data.grid3.org
      - icon: github
        href: https://github.com/ciesin/GRID3_dataUserGuide
      - icon: linkedin
        href: https://www.linkedin.com/company/center-for-integrated-earth-system-information-ciesin/
      - icon: globe
        href: https://ciesin.columbia.edu



format:
  html:
    theme:
      light: [default, theme-light.scss]
      dark:  [default, theme-dark.scss]
    respect-user-color-scheme: true
    css: custom.css
    toc: true
    toc-location: right
    toc-depth: 4
    toc-title: "On this page"
    link-external-icon: false
    link-external-newwindow: true
    smooth-scroll: true
    code-copy: true
    number-sections: false
    fig-width: 6
    fig-height: 4
    fig-dpi: 300
    fig-alt-text: true
    lightbox: true
    sidebar:
      collapse-level: 2
      float: false
      width: 300px

    include-in-header: google-analytics.html
