project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "notebooks/*.qmd"
    - "notebooks/*.ipynb"
    - "notebooks/visualization/*.qmd"
    - "notebooks/appendix/*.qmd"
    - "!notebooks/colab/"


execute:
  enabled: false
  freeze: auto
  echo: true
  warning: false
  message: false


website:

  description: "Practical guides for accessing, analyzing, and visualizing GRID3 data"
  site-url: https://tiles.ciesin.app/
  repo-url: https://github.com/ciesin/GRID3_dataUserGuide
  # repo-actions: [edit, issue]
  favicon: images/favicon.ico
  bread-crumbs: false
  back-to-top-navigation: true

  navbar:

    background: "#1D4F91"
    foreground: "#ffffff"

    logo: images/Columbia_University_Logo-Crown_white.png
    logo-href: /index.qmd

    collapse-below: "sm"

    left:
      - text: "Home"
        href: index.qmd
      - text: "Guides"
        menu:
          - text: "Data Access"
            href: notebooks/data-access.qmd
          - text: "Analysis"
            href: notebooks/analysis.qmd
          - text: "Visualization"
            href: notebooks/visualization/index.qmd
      - text: "Appendix"
        menu:
          - text: "Guide Template"
            href: notebooks/user_guide_template.qmd
          - text: "Glossary"
            href: notebooks/appendix/glossary.qmd
      - text: "About"
        href: notebooks/about.qmd


    right:
      - text: "Contact"
        menu:
        - icon: envelope-fill
          href: mailto:info@ciesin.columbia.edu
        - icon: database-fill
          href: https://data.grid3.org
        - icon: github
          href: https://github.com/ciesin/GRID3_dataUserGuide
        - icon: linkedin
          href: https://www.linkedin.com/company/center-for-integrated-earth-system-information-ciesin/
        - icon: globe
          href: https://ciesin.columbia.edu


  # one named sidebar per section
  # to auto-populate a sidebar from a folder, replace the explicit file list
  # with the folder path (e.g. "notebooks/visualization/")
  # notebook entries sorted by frontmatter "order" property

  sidebar:

    - id: data-access
      title: "Data Access"
      style: "docked"
      search: true
      collapse-level: 1
      contents:
        - text: "Overview"
          href: notebooks/data-access.qmd
        - notebooks/Roads_DRN_MD.qmd
        - notebooks/accessing_friction_surface_by_lga.qmd

    - id: analysis
      title: "Analysis"
      style: "docked"
      search: true
      collapse-level: 1
      contents:
        - text: "Overview"
          href: notebooks/analysis.qmd
        - notebooks/api_nga_network.ipynb

    - id: visualization
      title: "Visualization"
      style: "docked"
      search: true
      collapse-level: 1
      contents:
        - text: "Overview"
          href: notebooks/visualization/index.qmd
        - notebooks/visualization/visualization-qgis.qmd
        - section: "Visualization with PMTiles"
          contents:
            - notebooks/visualization/visualization-pmtiles-intro.qmd
            - notebooks/visualization/visualization-pmtiles.qmd

    - id: appendix
      title: "Appendix"
      style: "docked"
      search: true
      collapse-level: 1
      contents:
        - notebooks/user_guide_template.qmd
        - notebooks/appendix/glossary.qmd


  search:
    location: sidebar
    type: textbox

  google-analytics:
    tracking-id: "G-45WWDMVLWW"
    anonymize-ip: true

  # body-footer: _footer.html
  page-footer:
    left:
      - "© 2026 <a href='https://ciesin.columbia.edu'>Center for Integrated Earth System Information</a> (CIESIN), Columbia University."

    right:
      - icon: envelope-fill
        href: mailto:info@ciesin.columbia.edu
      - icon: database-fill
        href: https://data.grid3.org
      - icon: github
        href: https://github.com/ciesin/GRID3_dataUserGuide
      - icon: linkedin
        href: https://www.linkedin.com/company/center-for-integrated-earth-system-information-ciesin/
      - icon: globe
        href: https://ciesin.columbia.edu



format:
  html:
    theme: default
    css: custom.css
    toc: true
    toc-location: right
    toc-depth: 4
    toc-title: "On this page"
    toccolor: "#1D4F91"
    linkcolor: "#1D4F91"
    smooth-scroll: true
    code-copy: true
    number-sections: false
    fig-width: 6
    fig-height: 4
    fig-dpi: 120
    fig-alt-text: true
    lightbox: true
    navbar:
      type: default
    sidebar:
      collapse-level: 2
      float: false
      width: 300px

    include-in-header: google-analytics.html
